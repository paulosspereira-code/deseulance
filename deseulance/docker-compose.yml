networks:
  deseulancenet:
    name: deseulancenet
    driver: bridge

volumes:
    sql_data:  

services:

  api:
    container_name: deseulance-api
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=produzeSaas;User=sa;Password=Your_password123;TrustServerCertificate=True"
    networks:
      - deseulancenet
    depends_on:
      - sqlserver 

  sqlserver:
    container_name: deseulance-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      deseulancenet:
        aliases:
          - sqlserver